spring.application.name=libreria_rhotechnology
spring.datasource.url=jdbc:mysql://localhost:3306/libreria_db
spring.datasource.username=root
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.data.web.pageable.serialization-mode=via_dto
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
app.security.enabled=true

# JWT: il secret deve essere almeno 32 caratteri (HS256). In produzione definire la variabile JWT_SECRET
jwt.secret=${JWT_SECRET:change-me-local-dev-secret-32-caratteri}
jwt.expiration=86400000

# Swagger UI: mantiene il token inserito con "Authorize" dopo il refresh della pagina
springdoc.swagger-ui.persist-authorization=true